version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: makfinpay-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./storage_backup:/storage_backup
      - ./storage_backup:/app/storage_backup
    ports:
      - "8000:8000"
    networks:
      - makfinpay-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-/api}
        REACT_APP_SUPABASE_URL: ${REACT_APP_SUPABASE_URL}
        REACT_APP_SUPABASE_ANON_KEY: ${REACT_APP_SUPABASE_ANON_KEY}
    container_name: makfinpay-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - makfinpay-net

networks:
  makfinpay-net:
    driver: bridge
