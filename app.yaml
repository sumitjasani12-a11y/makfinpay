name: makfinpay
region: fra
services:
  - name: backend
    environment_slug: python
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    github:
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: JWT_SECRET
        scope: RUN_TIME
        value: AQZ3FxRJniXnp2qAbQ2hq3ZJburQogdsyQ4njZdrzZYHEm7mYkgCksBOXcxdGacIuBD3fje2LmwLUSvPkrWdYQ==
      - key: ADMIN_EMAIL
        scope: RUN_TIME
        value: makfinpay@gmail.com
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        value: Riyaz@1212

static_sites:
  - name: frontend
    source_dir: frontend
    build_command: npm run build
    output_dir: build
    github:
      branch: main
      deploy_on_push: true
    envs:
      - key: REACT_APP_BACKEND_URL
        scope: BUILD_TIME
        value: ${backend.PUBLIC_URL}
